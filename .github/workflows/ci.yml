name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: html-validate e ligações
        run: npm run check
      - name: Playwright
        run: npm test
      # O Ubuntu 24.04 restringe (AppArmor) os namespaces de que a sandbox do Chrome precisa;
      # sem isto o Chrome lançado pelo Lighthouse aborta com "No usable sandbox".
      - name: Permitir a sandbox do Chrome
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lighthouse CI (desktop e mobile)
        run: npm run lighthouse
      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore

  # Publica public/ no GitHub Pages; só em push para main e só se os testes passaram.
  deploy:
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
